<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 class="brand">MyPanel</h2>
      <nav>
        <a href="#">Overview</a>
        <a href="#">Analytics</a>
        <a href="#">Orders</a>
        <a href="#">Users</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Dashboard<h1> <!-- intentional syntax error -->
        <input type="search" placeholder="Search..." />
      </header>

      <section class="cards">
        <div class="card">
          <h3>Revenue</h3>
          <p>$12,480</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p>356</p>
        </div>
        <div class="card">
          <h3>Users</h3>
          <p>1,204</p>
        </div>
      </section>

      <section class="table-section">
        <h2>Recent Orders</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#1001</td>
              <td>Aman</td>
              <td>Completed</td>
              <td>$240</td>
            </tr>
            <tr>
              <td>#1002</td>
              <td>Riya</td>
              <td>Pending</td>
              <td>$180</td>
            </tr>
            <tr>
              <td>#1003</td>
              <td>Kabir</td>
              <td>Shipped</td>
              <td>$320</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
