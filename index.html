<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 class="brand">MyPanel</h2>
      <nav>
        <a href="/" class="active">Overview</a>
        <a href="/analytics">Analytics</a>
        <a href="#orders">Orders</a>
        <a href="#users">Users</a>
        <a href="/profile">Profile</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Dashboard</h1>
        <input type="search" placeholder="Search..." />
      </header>

      <section class="cards">
        <div class="card" id="revenue">
          <h3>Revenue</h3>
          <p>$12,480</p>
        </div>
        <div class="card" id="orders">
          <h3>Orders</h3>
          <p>356</p>
        </div>
        <div class="card" id="users">
          <h3>Users</h3>
          <p id="total-users">—</p>
        </div>
      </section>

      <section class="table-section">
        <h2>Recent Orders</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#1001</td>
              <td>Aman</td>
              <td>Completed</td>
              <td>$240</td>
            </tr>
            <tr>
              <td>#1002</td>
              <td>Riya</td>
              <td>Pending</td>
              <td>$180</td>
            </tr>
            <tr>
              <td>#1003</td>
              <td>Kabir</td>
              <td>Shipped</td>
              <td>$320</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="/script.js" defer></script>
</body>
</html>
